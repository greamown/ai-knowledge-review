<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f5f4ee" />
    <title data-en="Practice · Agent Knowledge Lab">
      選擇題測驗 · Agent Knowledge Lab
    </title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script src="site.js" defer></script>
  </head>
  <body>
    <a class="skip" href="#main"
      ><span data-en="Skip to content">跳至內容</span></a
    >
    <nav class="nav" aria-label="Main navigation">
      <div class="wrap">
        <a class="brand" href="index.html"
          ><span class="brand-mark" aria-hidden="true">a<span>·</span></span
          >Agent Knowledge <em>Lab</em></a
        >
        <div class="navlinks">
          <a href="../"><span data-en="All topics">全部主題</span></a
          ><a href="index.html"><span data-en="Overview">首頁</span></a
          ><a href="learn.html"><span data-en="Study">問答學習</span></a
          ><a href="quiz.html" class="active" aria-current="page"
            ><span data-en="Practice">選擇題測驗</span></a
          >
        </div>
        <button
          class="lang-toggle"
          id="language"
          type="button"
          aria-label="Switch to English"
        >
          EN <span aria-hidden="true">↗</span>
        </button>
      </div>
    </nav>
    <main id="main" class="wrap section">
      <header class="page-header quiz-header">
        <span class="eyebrow">03 / PUT IT INTO PRACTICE</span>
        <h1 data-en="Put your understanding to the test.">
          讓理解，經得起提問。
        </h1>
        <p
          data-en="15 questions in random order, with an explanation after every answer."
        >
          15 道題目，隨機出題。每次回答後，都能看到解析。
        </p>
      </header>
      <div class="quiz-layout">
        <aside class="quiz-aside">
          <span class="eyebrow">PRACTICE NOTES</span>
          <h2 data-en="Take your time.&lt;br&gt;Think about the why.">
            不用急，<br />先想想為什麼。
          </h2>
          <p
            data-en="Choose the best answer and check your reasoning. Missed questions will be collected at the end."
          >
            選出最合理的答案，再確認你的推理。答錯的題目會在最後整理給你。
          </p>
          <a class="text-link" href="learn.html"
            >← <span data-en="Back to study">回到問答學習</span></a
          >
        </aside>
        <section class="quiz-shell card" id="quiz" aria-label="Quiz">
          <div class="quiz-meta">
            <span id="counter"></span><span id="scoreLive" role="status"></span>
          </div>
          <div
            class="progress"
            role="progressbar"
            aria-label="Quiz progress"
            aria-valuemin="0"
            aria-valuemax="15"
            aria-valuenow="0"
          >
            <div id="bar"></div>
          </div>
          <h2 class="question" id="question" tabindex="-1"></h2>
          <div
            class="choices"
            id="choices"
            role="group"
            aria-labelledby="question"
          ></div>
          <div class="explain" id="explain" role="status"></div>
          <div class="actions">
            <button class="btn" id="submit" disabled></button
            ><button class="btn secondary" id="next" hidden></button
            ><span class="small" id="hint"></span>
          </div>
        </section>
      </div>
    </main>
    <footer class="footer wrap">
      <a class="brand" href="index.html">Agent Knowledge Lab</a
      ><span data-en="From understanding to a confident answer."
        >從理解，到真正能回答。</span
      ><span class="mono">LEARN. REASON. BUILD.</span>
    </footer>
    <script src="questions.js"></script>
    <script src="quiz.js"></script>
  </body>
</html>
